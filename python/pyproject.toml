[build-system]
requires = ["setuptools>=77", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "reasonable-acp"
version = "1.0.0"
description = "rACP v1 plain-text show-control protocol reference implementation"
readme = "README.md"
requires-python = ">=3.11"
license = "LicenseRef-Proprietary"
authors = [{ name = "Aurora" }]
dependencies = []

[project.optional-dependencies]
dev = [
    "pytest>=7.4",
    "pytest-cov>=4.1",
    "ruff>=0.6",
    "mypy>=1.11",
]

[tool.setuptools.packages.find]
where = ["src"]
include = ["racp*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]

[tool.ruff]
target-version = "py311"
line-length = 120
src = ["src", "tests"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]
ignore = ["UP042"]

[tool.ruff.lint.isort]
known-first-party = ["racp"]

[tool.mypy]
python_version = "3.11"
mypy_path = "src"
packages = ["racp"]
explicit_package_bases = true
warn_unused_ignores = true

[tool.coverage.run]
source = ["racp"]

[tool.coverage.report]
fail_under = 85
show_missing = true
