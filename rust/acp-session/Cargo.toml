[package]
name = "acp-session"
version.workspace = true
edition.workspace = true
license.workspace = true
description = "ACP session engine (Tokio full profile)"
rust-version.workspace = true

[dependencies]
acp-model = { path = "../acp-model" }
acp-codec = { path = "../acp-codec" }
tokio = { version = "1", features = ["io-util", "macros", "net", "rt", "rt-multi-thread", "sync", "time"] }
serde_json = "1"
# An open uuid 1.x range permits releases whose MSRV exceeds the workspace's
# Rust 1.75 contract. Keep the newest release qualified here exact;
# the dedicated MSRV CI job is the gate for changing this pin.
uuid = { version = "=1.18.1", features = ["v4"] }

[lints]
workspace = true
