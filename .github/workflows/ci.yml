name: ci

on:
  push:
    branches: [main, master]
  pull_request:

jobs:
  python:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install and test
        run: |
          python3 -m pip install -e './python[dev,security-vectors]'
          python3 -m ruff check --config python/pyproject.toml python scripts
          (cd python && python3 -m mypy src/acp)
          (cd python && python3 -m pytest tests --cov=acp --cov-fail-under=70)
      - name: Registry and vectors
        run: |
          python3 scripts/check_registry.py
          python3 scripts/freeze_vectors.py
          python3 scripts/security_vectors.py --write
          python3 scripts/security_vectors.py
          git diff --exit-code -- vectors/security
      - name: Localhost WebSocket HELLO
        run: python3 tests/interop/test_ws_hello.py
      - name: Localhost WebSocket Remote
        run: python3 tests/interop/test_ws_remote.py
      - name: Worktree stays clean
        run: |
          git status --porcelain
          test -z "$(git status --porcelain)"
      - name: Wheel install outside the tree
        run: |
          python3 -m pip install build
          python3 -m build --wheel --outdir dist python
          python3 -m pip install --force-reinstall dist/*.whl
          mkdir -p /tmp/acp-wheel-test && cd /tmp/acp-wheel-test
          python3 - <<'PY'
          from acp.constants import load, limits
          from acp.registry import lookup
          from acp.discovery import MAGIC
          assert load()["protocol"]["baseline"] == "1.2"
          assert limits()["max_message_bytes"] > 0
          assert lookup("session.hello")["legal_before_handshake"]
          assert MAGIC == b"ACP0"
          print("wheel import ok")
          PY

  rust:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
      - name: Test
        run: cargo test --manifest-path rust/Cargo.toml
      - name: Clippy
        run: cargo clippy --manifest-path rust/Cargo.toml --all-targets -- -D warnings
      - name: rustfmt
        working-directory: rust
        run: cargo fmt -- --check

  security-hardening:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install security test dependencies
        run: python3 -m pip install -e './python[dev,security-vectors]'
      - name: Property and malformed-input tests
        run: |
          python3 -m pytest python/tests/test_security_properties.py python/tests/test_security_operations.py
          PYTHONPATH=python/src python3 scripts/security_fuzz_smoke.py
      - name: Dependency profile and license policy
        run: python3 scripts/check_security_dependencies.py
      - name: Captured-output secret redaction
        run: python3 -m pytest python/tests/test_security_operations.py -k redacted

  security-api-boundary:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - uses: dtolnay/rust-toolchain@stable
      - name: Build release artifacts
        run: |
          python3 -m pip install build
          python3 -m build --wheel --outdir dist python
          cargo build --manifest-path rust/Cargo.toml --release -p acp-security
          swift build -c release
          swift package dump-symbol-graph --minimum-access-level public
      - name: Prove fabrication APIs are absent
        run: |
          python3 scripts/check_security_api_boundary.py
          python3 scripts/check_security_release_artifacts.py \
            --swift-symbol-dir "$(dirname "$(find .build -name 'AuroraACP.symbols.json' -print -quit)")" \
            --python-wheel "$(find dist -name '*.whl' -print -quit)" \
            --rust-library "$(find rust/target/release/deps -name 'libacp_security-*.rlib' -print -quit)"

  dependency-advisories:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Rust advisory database
        run: cargo install cargo-audit --locked && cargo audit --file rust/Cargo.lock
      - name: Python advisory database
        run: python3 -m pip install -e './python[dev,security-vectors]' pip-audit && python3 -m pip_audit --local

  rust-msrv:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@1.75.0
      - name: Prove declared Rust 1.75 MSRV
        working-directory: rust
        run: |
          rustc --version | grep '^rustc 1\.75\.0 '
          cargo --version | grep '^cargo 1\.75\.0 '
          cargo check --workspace --locked
          cargo test --workspace --locked
          cargo check --workspace --all-targets --locked

  framed-python-rust-hello:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - uses: dtolnay/rust-toolchain@stable
      - name: Python/Rust framed HELLO
        run: |
          python3 -m pip install -e './python[dev]'
          cargo build --manifest-path rust/Cargo.toml -p acp-session --example framed_hello
          python3 tests/interop/test_framed_cross.py --sdk rust --suite hello

  framed-python-rust-session:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - uses: dtolnay/rust-toolchain@stable
      - name: Python/Rust framed session, Remote, and negatives
        run: |
          python3 -m pip install -e './python[dev]'
          cargo build --manifest-path rust/Cargo.toml -p acp-session --example framed_hello
          python3 tests/interop/test_framed_cross.py --sdk rust --suite session
          python3 tests/interop/test_framed_cross.py --sdk rust --suite remote
          python3 tests/interop/test_framed_cross.py --sdk rust --suite negative

  hygiene:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: No generated artifacts in the worktree
        run: |
          test ! -d rust/target
          test ! -d tmp
          test -z "$(git ls-files -z -- '**/__pycache__/**' '**/*.pyc' '**/*.egg-info/**' | tr -d '\0')"
          git status --porcelain
          test -z "$(git status --porcelain)"

  swift:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4
      - name: Test
        run: swift test
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - uses: dtolnay/rust-toolchain@stable
      - name: Python/Swift framed HELLO
        run: |
          python3 -m pip install -e './python[dev]'
          swift build --product acp-framed-hello
          python3 tests/interop/test_framed_cross.py --sdk swift --suite hello
      - name: Python/Swift framed session and Remote
        run: |
          python3 tests/interop/test_framed_cross.py --sdk swift --suite session
          python3 tests/interop/test_framed_cross.py --sdk swift --suite remote
          python3 tests/interop/test_framed_cross.py --sdk swift --suite negative
      - name: Rust/Swift framed session
        run: |
          cargo build --manifest-path rust/Cargo.toml -p acp-session --example framed_hello
          python3 tests/interop/test_framed_cross.py --sdk rust-swift --suite session
