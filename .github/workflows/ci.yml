name: ci

on:
  push:
    branches: [main]
  pull_request:

jobs:
  swift:
    runs-on: macos-15
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - name: Build and test Swift package
        run: swift test
      - name: Worktree stays clean
        run: test -z "$(git status --porcelain)"

  python:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: "3.11"
      - name: Install
        run: python3 -m pip install -e './python[dev]'
      - name: Test
        working-directory: python
        run: python3 -m pytest --cov=racp --cov-fail-under=85
      - name: Lint and type-check
        working-directory: python
        run: |
          python3 -m ruff check src tests
          python3 -m mypy src/racp
      - name: Build and verify wheel
        run: |
          python3 -m pip install build
          python3 -m build --wheel --outdir dist python
          python3 -m pip install --force-reinstall dist/*.whl
          cd /tmp
          python3 -c 'import racp; assert racp.MAX_LINE_BYTES == 16384'
      - name: Worktree stays clean
        run: test -z "$(git status --porcelain)"
