[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "aurora-acp-workbench"
version = "0.1.0"
description = "GUI and CLI interoperability workbench for Aurora ACP"
readme = "README.md"
requires-python = ">=3.11"
license = { text = "LicenseRef-Proprietary" }
dependencies = ["aurora-acp>=1.2,<1.3"]

[project.optional-dependencies]
yaml = ["PyYAML>=6.0"]
gui = ["PySide6>=6.7"]
dev = ["pytest>=7.4", "pytest-cov>=4.1", "ruff>=0.6", "mypy>=1.11"]

[project.scripts]
acp-workbench = "acp_workbench.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src", "../../python/src"]

[tool.ruff]
target-version = "py311"
line-length = 120
src = ["src", "tests"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]

[tool.mypy]
python_version = "3.11"
mypy_path = "src:../../python/src"
packages = ["acp_workbench"]
explicit_package_bases = true
warn_unused_ignores = true
disable_error_code = ["import-not-found", "import-untyped"]

[tool.coverage.run]
source = ["acp_workbench"]
omit = [
    "*/acp_workbench/__main__.py",
    "*/acp_workbench/cli.py",
    "*/acp_workbench/gui.py",
]

[tool.coverage.report]
fail_under = 80
show_missing = true
