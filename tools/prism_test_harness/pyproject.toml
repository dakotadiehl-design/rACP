[build-system]
requires = ["setuptools>=77", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "prism-racp-test-harness"
version = "0.1.0"
description = "Black-box rACP integration tester for Prism"
requires-python = ">=3.11"
dependencies = ["reasonable-acp==1.0.0"]

[project.optional-dependencies]
dev = ["pytest>=7.4", "ruff>=0.6", "mypy>=1.11"]

[project.scripts]
prism-racp-test = "prism_harness.cli:main"

[tool.setuptools.packages.find]
include = ["prism_harness*"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff]
target-version = "py311"
line-length = 120

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]

[tool.mypy]
python_version = "3.11"
packages = ["prism_harness"]
strict = true

