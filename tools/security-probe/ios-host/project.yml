name: ACPiOSQualificationHost
options:
  deploymentTarget: {iOS: "16.0"}
settings:
  base: {SWIFT_VERSION: "5.9", CODE_SIGN_STYLE: Automatic}
targets:
  ACPiOSQualificationHost:
    type: application
    platform: iOS
    sources: [Host]
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: org.aurora.acp.qualificationhost
        CODE_SIGN_ENTITLEMENTS: Host/ACPiOSQualificationHost.entitlements
        GENERATE_INFOPLIST_FILE: YES
  ACPiOSQualificationHostTests:
    type: bundle.unit-test
    platform: iOS
    sources: [Tests]
    dependencies:
      - target: ACPiOSQualificationHost
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: org.aurora.acp.qualificationhost.tests
        GENERATE_INFOPLIST_FILE: YES
schemes:
  ACPiOSQualificationHost:
    build:
      targets:
        ACPiOSQualificationHost: all
        ACPiOSQualificationHostTests: [test]
    test:
      targets: [ACPiOSQualificationHostTests]
